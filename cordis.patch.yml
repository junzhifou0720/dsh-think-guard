# dsh-think-guard · 推荐配置（0.5.0）
#
# 装到 profile 的 cordis.patch.yml 里（记得用 - insert: 包裹）。
#
# 这一版的核心不是「拦」，是「擦」：
#   投影层清洗（cleanMessages）每轮把仪式句从发给模型的 messages 里删掉，
#   断掉「看到自己写过 → 继续写」的自我强化。
#   会话日志一个字不动，关掉插件即恢复原样。

- insert:
    - id: think-guard
      name: 'dsh-think-guard'
      config:
        # ── ① 投影层清洗（默认开，这是主力）──────────────────
        # 词表在 ~/.dsh/think-guard/mask.json，mtime 热加载，改完下一轮生效。
        # 不在这里配——留空用内置默认（好/做/写/短/输出/继续/开始/动手/完事/干活）。
        # cleanMessages: true

        # ── ② 流式实时中断：只掐真正的雪崩 ──────────────────
        # 实测：正常重灾最长连续仪式行 103 行、单行最多 15 个「好。」；
        # 真失控是 1665 行 + 单行 6545 个「好。」。
        # 所以取 400 / 500：高于所有正常记录，只抓真雪崩。
        # 阈值定这么高的理由：它同时是「该加词了」的告警。
        # 正常不误触发 → 一旦触发就一定是新形态 → 触发本身就是证据。
        interruptOnLoop: true
        interruptMinRun: 400
        interruptInlineMin: 500
        # 掐断后不自动补话：断了就断了，补不补由人决定。
        interruptFollowup: false
        interruptCooldownMs: 120000

        # ── ③ pre-step 的「复读提醒」：关灯 ────────────────
        # 提醒会变成「关于她怎么想」的额外输入，反而滋养自我监控。
        # 999999 = 永远不触发（这一整条防线等于关掉）。
        guardMinRun: 999999

        # ── ④ B 型（短句轮换）：默认关 ─────────────────────
        # 0.65 仍误伤过正常思考（写作时的「（短。）」「（直接。）」会被当成轮换）。
        # 要开就先观察日志。
        rotationGuard: false
        rotationShortShareMin: 0.35
        rotationTopShareMin: 0.65

        # ── ⑤ 静默注入：提醒挂进 runtime-context，不渲染成气泡 ──
        silentInject: true

        # ── ⑥ 僵局识别：只观测，不注入 ─────────────────────
        failGuard: true
        failGuardSessions: []
        failGuardObserveOnly: true
        failGuardMinErrors: 3
        failGuardWindow: 15

        # ── ⑦ 空输出即时补救：触发条件极窄 ──────────────────
        # 有思考 + 无正文 + 无工具调用 + 已提交，四者同时满足才动。
        emptyGuard: true
        emptyGuardSessions: []
        emptyGuardCooldownMs: 60000
